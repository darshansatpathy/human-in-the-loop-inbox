[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "human-in-the-loop-inbox"
version = "0.1.0"
description = "Approval inbox for agent actions: policy rules, quorum, Slack and email approvals, single-use grants bound to the approved arguments, and a tamper-evident audit log."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "prometheus-client>=0.21",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13", "types-PyYAML", "aiosmtpd>=1.4"]

[project.scripts]
hitl = "hitl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hitl = ["schema.sql"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.ruff.lint.pycodestyle]
max-line-length = 190

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["hitl"]
